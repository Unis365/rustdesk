name: Windows Build and Release

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  BUILD_ARTIFACTS: "build_artifacts"

on:
  push:
    tags:
      - 'v*'  # 当推送v开头的tag时触发，如v1.0.0
  workflow_dispatch:  # 手动触发

jobs:
  build:
    name: Build and Release Windows Installers
    runs-on: windows-2022
    
    steps:
    - name: Create artifacts directory
      shell: bash
      run: mkdir -p ${{ env.BUILD_ARTIFACTS }}
      
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: ${{ github.workspace }}/vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

    - name: Install vcpkg dependencies
      shell: cmd
      run: |
        set VCPKG_ROOT=%GITHUB_WORKSPACE%\vcpkg
        %VCPKG_ROOT%\vcpkg install --triplet x64-windows-static

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable
        targets: x86_64-pc-windows-msvc
        components: ''

    - name: Show version information
      shell: bash
      run: |
        rustup -V
        rustup toolchain list
        cargo -V
        rustc -V

    - uses: Swatinem/rust-cache@v2

    - name: Build release binary
      uses: actions-rs/cargo@v1
      with:
        command: build
        args: --release --locked --target=x86_64-pc-windows-msvc

    - name: Generate Windows installers
      shell: powershell
      run: |
        # 调用RustDesk内置打包命令
        cargo run --release --target=x86_64-pc-windows-msvc --package rustdesk --bin rustdesk -- --pack
        
        # 复制生成的安装包到artifacts目录
        Copy-Item "target\x86_64-pc-windows-msvc\release\output\*" $env:BUILD_ARTIFACTS
        
        # 列出生成的文件
        Write-Host "Generated files:"
        Get-ChildItem $env:BUILD_ARTIFACTS

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: |
          ${{ env.BUILD_ARTIFACTS }}/*.exe
          ${{ env.BUILD_ARTIFACTS }}/*.msi
          ${{ env.BUILD_ARTIFACTS }}/*.zip

    - name: Upload Artifacts (Manual Trigger)
      uses: actions/upload-artifact@v4
      if: github.event_name == 'workflow_dispatch'
      with:
        name: windows-installers
        path: ${{ env.BUILD_ARTIFACTS }}/*
        retention-days: 30
